name: Publish Findroid TV

on:
  workflow_dispatch:
  push:
    tags:
      - v*-atv.*

permissions:
  contents: read

jobs:
  build:
    name: Build and verify TV APKs
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Decode TV release keystore
        shell: bash
        env:
          FINDROID_TV_KEYSTORE_BASE64: ${{ secrets.FINDROID_TV_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore_file="$RUNNER_TEMP/findroid-tv-release.p12"
          printf '%s' "$FINDROID_TV_KEYSTORE_BASE64" | base64 --decode > "$keystore_file"
          chmod 600 "$keystore_file"
          echo "FINDROID_TV_KEYSTORE_FILE=$keystore_file" >> "$GITHUB_ENV"

      - name: Build and verify TV release assets
        shell: bash
        env:
          FINDROID_TV_KEYSTORE_PASSWORD: ${{ secrets.FINDROID_TV_KEYSTORE_PASSWORD }}
          FINDROID_TV_KEY_ALIAS: ${{ secrets.FINDROID_TV_KEY_ALIAS }}
          FINDROID_TV_KEY_PASSWORD: ${{ secrets.FINDROID_TV_KEY_PASSWORD }}
        run: |
          scripts/release/build-findroid-tv-release.sh "$RUNNER_TEMP/findroid-tv-assets"
          scripts/release/verify-findroid-tv-release.sh "$RUNNER_TEMP/findroid-tv-assets"

      - name: Upload private workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: findroid-tv-release-assets
          path: |
            ${{ runner.temp }}/findroid-tv-assets/findroid-tv-1.1.0-atv.1-armeabi-v7a.apk
            ${{ runner.temp }}/findroid-tv-assets/findroid-tv-1.1.0-atv.1-arm64-v8a.apk
            ${{ runner.temp }}/findroid-tv-assets/findroid-tv-1.1.0-atv.1-x86.apk
            ${{ runner.temp }}/findroid-tv-assets/findroid-tv-1.1.0-atv.1-x86_64.apk
            ${{ runner.temp }}/findroid-tv-assets/findroid-tv-1.1.0-atv.1-universal.apk
            ${{ runner.temp }}/findroid-tv-assets/SHA256SUMS
          if-no-files-found: error

  release:
    name: Create draft TV prerelease
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate versioned release notes
        shell: bash
        run: |
          set -euo pipefail
          source scripts/release/findroid-tv-release.env
          [[ "$GITHUB_REF_NAME" == "$FINDROID_TV_RELEASE_TAG" ]] || {
            echo "Tag $GITHUB_REF_NAME does not match canonical release $FINDROID_TV_RELEASE_TAG" >&2
            exit 1
          }
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          [[ -f "$notes" ]] || { echo "Missing release notes: $notes" >&2; exit 1; }
          if grep -q 'CERTIFICATE_SHA256_PLACEHOLDER' "$notes"; then
            echo "Release certificate fingerprint placeholder is unresolved: $notes" >&2
            exit 1
          fi

      - name: Download verified assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: findroid-tv-release-assets
          path: ${{ runner.temp }}/findroid-tv-assets

      - name: Create draft prerelease
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          draft: true
          prerelease: true
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            ${{ runner.temp }}/findroid-tv-assets/findroid-tv-1.1.0-atv.1-armeabi-v7a.apk
            ${{ runner.temp }}/findroid-tv-assets/findroid-tv-1.1.0-atv.1-arm64-v8a.apk
            ${{ runner.temp }}/findroid-tv-assets/findroid-tv-1.1.0-atv.1-x86.apk
            ${{ runner.temp }}/findroid-tv-assets/findroid-tv-1.1.0-atv.1-x86_64.apk
            ${{ runner.temp }}/findroid-tv-assets/findroid-tv-1.1.0-atv.1-universal.apk
            ${{ runner.temp }}/findroid-tv-assets/SHA256SUMS
